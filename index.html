<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Lantern at the Edge of Summer</title>
    <meta
      name="description"
      content="Read The Lantern at the Edge of Summer by Ernestina S. Berkoh, a dreamy island adventure about wonder, courage, memory, and belonging."
    />
    <meta name="author" content="Ernestina S. Berkoh" />
    <meta name="theme-color" content="#f7efe3" />
    <link rel="canonical" href="https://tinpa134.github.io/carazcht/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Lantern at the Edge of Summer" />
    <meta
      property="og:description"
      content="A dreamy island adventure about wonder, courage, memory, and belonging by Ernestina S. Berkoh."
    />
    <meta property="og:url" content="https://tinpa134.github.io/carazcht/" />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=1200&amp;q=80"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="sitemap" type="application/xml" href="/carazcht/sitemap.xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">A dreamy story</p>
          <h1>The Lantern at the Edge of Summer</h1>
          <p class="author-line">By Ernestina S. Berkoh</p>
        </div>
        <button id="themeToggle" class="toggle" type="button" aria-label="Toggle theme">
          Night mode
        </button>
      </header>

      <div class="book-layout">
        <aside class="sidebar" aria-label="Table of contents">
          <div class="sidebar-card">
            <p class="section-label">Contents</p>
            <nav id="toc" class="toc"></nav>
          </div>
        </aside>

        <main class="reader" aria-live="polite">
          <article id="chapterContent" class="chapter-card"></article>

          <div class="reader-footer">
            <button id="prevBtn" class="nav-btn" type="button">Previous</button>
            <div class="progress-wrap" aria-label="Reading progress">
              <div class="progress-label">
                <span id="progressText">Chapter 1 of 5</span>
              </div>
              <div class="progress-bar" aria-hidden="true">
                <span id="progressFill"></span>
              </div>
            </div>
            <button id="nextBtn" class="nav-btn primary" type="button">Next</button>
          </div>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
